plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdk 37

    defaultConfig {
        applicationId "sff.org.conventions"
        minSdk 23
        targetSdk 37
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
//            applicationIdSuffix ".debug"
            versionNameSuffix ".debug"
        }
    }
    // Required since we have dependency in SDK references (such as the Log, Html and Color classes)
    testOptions {
        unitTests.returnDefaultValues = true
    }
    compileOptions {
        // This is the version supported on the defined minSdkVersion
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    java {
        toolchain {
            // This is required to ensure compiled code is compatible with the defined compatibility version.
            // This Java version is above the minimal version required for the defined targetSdk version
            // but still supports this compatibility version.
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
    namespace = 'sff.org.conventions'
    buildFeatures {
        buildConfig = true
    }

}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.github.castorflex.verticalviewpager:library:19.0.1'
    implementation 'androidx.viewpager:viewpager:1.1.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-messaging:25.1.1'
    implementation 'com.google.firebase:firebase-analytics:23.2.0'
    implementation 'com.google.firebase:firebase-crashlytics:20.1.0'
    implementation 'com.caverock:androidsvg:1.4'
    // Using a fork of se.emilsjolander:stickylistheaders due to an open issue in Android 8. See https://github.com/emilsjolander/StickyListHeaders/issues/477.
    implementation 'com.github.mtotschnig:StickyListHeaders:2.7.1'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'net.openid:appauth:0.11.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'com.opencsv:opencsv:5.12.0' // For events json-to-csv conversion
    testImplementation 'org.apache.commons:commons-text:1.15.0' // For events json-to-csv conversion
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'org.mockito:mockito-android:5.23.0'
    androidTestImplementation 'junit:junit:4.13.2'
}